<div id="add-education-modal"
     class="education-form-modal project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-education-modal-title">
    <button type="button"
            class="education-form-modal__backdrop project-form-modal__backdrop"
            popovertarget="add-education-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah riwayat pendidikan"></button>
    <div class="education-form-modal__content project-form-modal__content">
        <button type="button"
                class="education-form-modal__close project-form-modal__close"
                popovertarget="add-education-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah riwayat pendidikan">×</button>
        <h2 id="add-education-modal-title">Tambah Riwayat Pendidikan</h2>
        <form id="education-form"
              method="post"
              action="{% url 'main:create_education' %}"
              class="education-form project-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <p class="form-error">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}
            <div class="education-form-modal__actions project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-education-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Riwayat Pendidikan</button>
            </div>
        </form>
    </div>
</div>
