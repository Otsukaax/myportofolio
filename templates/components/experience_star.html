<form action="{% url 'main:toggle_experience_star' experience.id %}" method="POST" style="display: inline;">
    {% csrf_token %}
    <button type="submit" class="star-btn" aria-label="Star Experience" title="Berikan bintang!">
        {% if user in experience.starred_by.all %}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#00ffcc" width="24px" height="24px">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>
        {% else %}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="feather feather-star" width="24px" height="24px">
            <polygon
                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
            </polygon>
        </svg>
        {% endif %}
        <span class="star-count">{{ experience.starred_by.count }}</span>
    </button>
</form>
